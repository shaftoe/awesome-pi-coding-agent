name: Daily Dependency Update

# ─────────────────────────────────────────────────────────────────────────────
# Runs daily at 06:00 UTC and can also be triggered manually.
# Calls the reusable update-bun-deps workflow to bump packages and open a PR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-deps:
    uses: shaftoe/update-bun-dependencies-action/.github/workflows/update-bun-dependencies.yml@v1
    with:
      latest: true
      pr-title: "chore: update dependencies"
      pr-commit-message: "chore: update dependencies"
      post-update-run: "bun run test"

  update-deps-astro:
    uses: shaftoe/update-bun-dependencies-action/.github/workflows/update-bun-dependencies.yml@v1
    with:
      working-directory: "site/"
      latest: true
      pr-title: "chore: update dependencies (Astro)"
      pr-commit-message: "chore: update dependencies (Astro)"
      post-update-run: "bun run build"
