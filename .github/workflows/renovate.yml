name: Renovate

# ─────────────────────────────────────────────────────────────────────────────
# Runs daily at 06:00 UTC and can also be triggered manually.
# Uses the self-hosted Renovate action to bump dependencies (root + site/)
# and open update PRs.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: .github/renovate.json
