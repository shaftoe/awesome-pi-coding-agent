pre-commit:
  parallel: false
  commands:
    format:
      run: pnpm run format
      stage_fixed: true
    lint:
      run: pnpm run lint:fix
      stage_fixed: true
    validate:
      run: pnpm run check
    generate:
      run: pnpm run generate
      glob: "README.md"
      stage_fixed: true

pre-push:
  commands:
    validate:
      run: pnpm run check
    test:
      run: pnpm run test
